<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своё Вино | Картинки личного кабинета</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 24px 16px 48px; background: #fefdfa; color: #2c2a28; font-family: 'Inter', -apple-system, sans-serif; }
        main { max-width: 960px; margin: 0 auto; }
        .kicker { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #857e79; }
        h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 28px; margin: 4px 0 6px; }
        h2 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 20px; margin: 28px 0 12px; color: #8f3d42; }
        p { color: #857e79; font-size: 14px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .cell { background: #fff; border: 1px solid #ebe9e9; border-radius: 20px; padding: 12px 10px 10px; text-align: center; box-shadow: 0 10px 30px rgba(44,42,40,.06); }
        .big { display: flex; justify-content: center; gap: 6px; }
        .small { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }
        .name { font-size: 12px; color: #423f3c; margin-top: 8px; line-height: 1.3; }
        .key { font-size: 10px; color: #857e79; font-family: ui-monospace, monospace; }
    </style>
</head>
<body>
    <main>
        <div class="kicker">Личный кабинет · этап 1</div>
        <h1>Картинки кабинета</h1>
        <p>Каждая картинка: 64 px, 64 px «ещё не получено», 32 px и 32 px серая.</p>
        <div id="groups"></div>
    </main>
    <script type="module">
        import { ART, ART_GROUP_TITLES, artSvg } from './art.js';

        const root = document.getElementById('groups');
        for (const [group, items] of Object.entries(ART)) {
            const title = document.createElement('h2');
            title.textContent = ART_GROUP_TITLES[group];
            const grid = document.createElement('div');
            grid.className = 'grid';
            for (const item of items) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const big = document.createElement('div');
                big.className = 'big';
                big.append(artSvg(group, item.key, { size: 64 }), artSvg(group, item.key, { size: 64, locked: true }));
                const small = document.createElement('div');
                small.className = 'small';
                small.append(artSvg(group, item.key, { size: 32 }), artSvg(group, item.key, { size: 32, locked: true }));
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = item.title;
                const key = document.createElement('div');
                key.className = 'key';
                key.textContent = `${group}/${item.key}`;
                cell.append(big, small, name, key);
                grid.append(cell);
            }
            root.append(title, grid);
        }
    </script>
</body>
</html>
